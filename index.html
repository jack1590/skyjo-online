<!doctype html>
<html lang="en" translate="no" data-theme="casual">
  <head>
    <meta charset="UTF-8" />
    <!-- A Classic player's look (M28), before the first paint: the app's own code runs too late. -->
    <script>
      try {
        if (localStorage.getItem("skyjo:theme") === "classic") {
          document.documentElement.dataset.theme = "classic";
        }
      } catch {}
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- The game has its own languages. A page translator swaps the text nodes React updates, so
         numbers froze on screen (BUG-3). -->
    <meta name="google" content="notranslate" />
    <title>Skyjo Online</title>
    <meta name="description" content="Flip, swap, and keep your score low. Play with 2–8 friends." />
    <meta name="theme-color" content="#2a1f7a" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Skyjo" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
