name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: # manual redeploy of main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push supersedes a PR run, but a deploy on main is never cut off halfway.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    # Fail fast: a healthy run takes about a minute; a hung one shouldn't burn half an hour.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: CHANGELOG has a section for the package version
        run: |
          version=$(node -p "require('./package.json').version")
          grep -q "^## \[$version\]" CHANGELOG.md || { echo "Add a '## [$version]' section to CHANGELOG.md"; exit 1; }
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: e2e (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Browsers and their system libraries are preinstalled. The tag must equal the exact
    # @playwright/test version pinned in package.json.
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    strategy:
      fail-fast: false
      matrix:
        include:
          # WebKit is the critical path: on one runner, the iPhone project took 80–82 s with 2
          # workers (Playwright's default on 4 vCPUs) and 62 s with 4 (PR #17 probe).
          - { name: iphone, project: iphone, workers: 4 }
    steps:
      - uses: actions/checkout@v5
      - run: npm ci
      - run: npm run build
      - if: matrix.server == 'node'
        run: npm run build:node
      - run: npx playwright test ${{ matrix.spec }} --project=${{ matrix.project }} ${{ matrix.workers && format('--workers={0}', matrix.workers) || '' }}
        env:
          SERVER: ${{ matrix.server }}
      - name: probe, no trace
        run: npx playwright test --project=iphone --workers=4 --trace=off
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.name }}
          path: playwright-report/
          retention-days: 7

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [ci, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - id: deploy
        # bash (not the default `bash -e {0}`) turns on pipefail, so a failed deploy fails here, not behind `tee`.
        shell: bash
        run: |
          npx wrangler deploy | tee deploy.log
          echo "url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  smoke:
    name: smoke (live)
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v5
      - run: test -n "$BASE_URL" || { echo "deploy printed no workers.dev URL"; exit 1; }
        env:
          BASE_URL: ${{ needs.deploy.outputs.url }}
      - run: npm ci
      # A brand-new workers.dev route can take a few seconds to answer.
      - run: |
          for i in $(seq 1 20); do
            node -e "fetch(process.env.BASE_URL).then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))" && exit 0
            sleep 3
          done
          exit 1
        env:
          BASE_URL: ${{ needs.deploy.outputs.url }}
      # Two phones play a round and the next deal, and a reload keeps the seat, against the live site.
      # One runner is one IP under the production limits: a whole game at bot speed (about 25
      # messages/s) would trip the 120-a-minute message budget; a round is about 50 messages.
      - run: npx playwright test e2e/online.spec.ts --project=pixel -g "a round runs|keeps your seat"
        env:
          BASE_URL: ${{ needs.deploy.outputs.url }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-smoke
          path: playwright-report/
          retention-days: 7

  # After the live smoke test passes: publish a GitHub Release for a version not released yet.
  release:
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Tag and publish v<version> with its CHANGELOG section
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version is already released"; exit 0
          fi
          awk -v v="$version" 'index($0, "## [" v "]") == 1 { on = 1; next } /^## \[/ && on { exit } on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no notes for $version"; exit 1; }
          gh release create "v$version" --target "$GITHUB_SHA" --title "v$version" --notes-file notes.md
