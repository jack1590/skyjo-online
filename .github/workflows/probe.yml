# Throwaway probe for PR #17 RC2 (not for merge): is the clock UI the WebKit cost? One machine.
name: Probe
on:
  push:
    branches: [m8-ci-probe]
permissions:
  contents: read
jobs:
  same-machine:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: npm ci
      - name: Variants, interleaved
        shell: bash
        run: |
          set +e +o pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          run() {
            git reset -q --hard HEAD && git clean -fdq src e2e public
            case "$1" in
              main) git checkout -q 525758899a047165d06e20a6bb3122b360ec5be9 -- src e2e public ;;
              no-bar) printf '\n.clock { display: none !important; }\n' >> src/client/styles.css ;;
              no-clock-ui) printf '\n.clock, .ring, .opp-left { display: none !important; }\n' >> src/client/styles.css ;;
            esac
            npm run build > /dev/null 2>&1
            start=$(date +%s)
            npx playwright test --project=iphone --workers=2 --reporter=list > "/tmp/$1-$2.log" 2>&1
            end=$(date +%s)
            round=$(grep -E 'a round runs to its summary' "/tmp/$1-$2.log" | grep -oE '\([0-9.]+s\)$' | tr -d '()')
            echo "RESULT $1 pass$2 wall=$((end-start))s round=$round $(grep -E ' passed| failed' "/tmp/$1-$2.log" | tr -s ' ' | tr '\n' ' ')"
          }
          for pass in 1 2 3; do
            for v in head main no-bar no-clock-ui; do run $v $pass; done
          done
