# Throwaway probe for PR #17 RC2 (not for merge). All variants on one machine, interleaved.
name: Probe
on:
  push:
    branches: [m8-ci-probe]
permissions:
  contents: read
jobs:
  same-machine:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: npm ci
      - name: Whole iPhone project x3 on head, with the instrumented round
        run: |
          npm run build > /dev/null 2>&1
          for i in 1 2 3; do npx playwright test --project=iphone --workers=2 --reporter=list 2>&1 | grep -vE "^\s+✓" ; done
