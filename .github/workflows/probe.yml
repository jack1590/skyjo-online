# Throwaway probe for PR #17 RC2 (not for merge). All variants on one machine, interleaved.
name: Probe
on:
  push:
    branches: [m8-ci-probe]
permissions:
  contents: read
jobs:
  same-machine:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: npm ci
      - name: Round probe x8 on head
        run: npm run build > /dev/null 2>&1 && npx playwright test e2e/zz-round-probe.spec.ts --project=iphone --repeat-each=8 --workers=2 --reporter=list
