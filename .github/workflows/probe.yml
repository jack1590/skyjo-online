# Throwaway probe for PR #17 RC2 (not for merge): which M8 change slows CI's Linux WebKit?
name: Probe
on:
  push:
    branches: [m8-ci-probe]
permissions:
  contents: read
jobs:
  whole:
    name: whole (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    strategy:
      fail-fast: false
      matrix:
        variant: [head, main, no-ring, no-ring-no-bar]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Variant
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          case "${{ matrix.variant }}" in
            main) git checkout -q 525758899a047165d06e20a6bb3122b360ec5be9 -- src e2e package.json package-lock.json public ;;
            no-ring) printf '\n.ring { display: none !important; }\n' >> src/client/styles.css ;;
            no-ring-no-bar) printf '\n.ring, .clock { display: none !important; }\n' >> src/client/styles.css ;;
          esac
          git diff --stat
      - run: npm ci
      - run: npm run build
      - name: Whole iPhone project, run 1
        run: npx playwright test --project=iphone --retries=0 --reporter=list
      - name: Whole iPhone project, run 2
        if: always()
        run: npx playwright test --project=iphone --retries=0 --reporter=list
