# Throwaway probe for PR #17 RC2 (not for merge): workers 2 vs 3 vs 4, one machine, interleaved.
name: Probe
on:
  push:
    branches: [m8-ci-probe]
permissions:
  contents: read
jobs:
  same-machine:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v5
      - run: npm ci
      - run: npm run build
      - name: Workers, interleaved
        shell: bash
        run: |
          set +e +o pipefail
          for pass in 1 2 3; do
            for w in 2 3 4; do
              start=$(date +%s)
              npx playwright test --project=iphone --workers=$w --reporter=list > /tmp/w$w-$pass.log 2>&1
              end=$(date +%s)
              slow=$(grep -oE '\\(([0-9]{2}\\.[0-9])s\\)$' /tmp/w$w-$pass.log | tr -d '()s' | sort -rn | head -3 | tr '\\n' ' ')
              echo "RESULT workers=$w pass$pass wall=$((end-start))s slowest=[$slow] $(grep -E ' passed| failed| flaky' /tmp/w$w-$pass.log | tr -s ' ' | tr '\\n' ' ')"
              grep -E "✘" /tmp/w$w-$pass.log | head -3
            done
          done
