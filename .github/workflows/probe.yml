# Throwaway probe for PR #17 RC2 (not for merge). All variants on one machine, interleaved.
name: Probe
on:
  push:
    branches: [m8-ci-probe]
permissions:
  contents: read
jobs:
  same-machine:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: npm ci
      - name: Variants, interleaved
        shell: bash
        run: |
          set +e +o pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          nproc
          run() {
            git reset -q --hard HEAD && git clean -fdq src e2e public
            workers=2
            case "$1" in
              main) git checkout -q 525758899a047165d06e20a6bb3122b360ec5be9 -- src e2e public ;;
              real-wakelock) sed -i 's/^  if (!Object.getOwnPropertyDescriptor(navigator, "wakeLock")) {/  if (false) {/' e2e/helpers.ts ;;
              workers4) workers=4 ;;
              no-ring) printf '\n.ring { display: none !important; }\n' >> src/client/styles.css ;;
            esac
            reporter="--reporter=list"
            [ "$1" = html ] && reporter=""
            npm run build > /dev/null 2>&1
            start=$(date +%s)
            npx playwright test --project=iphone --workers=$workers $reporter > "/tmp/$1-$2.log" 2>&1 || true
            end=$(date +%s)
            round=$(grep -E 'a round runs to its summary' "/tmp/$1-$2.log" | grep -oE '\(([0-9.]+)s\)$' | tr -d '()')
            m8=$(grep -E 'M8: a player who ticks' "/tmp/$1-$2.log" | grep -oE '\(([0-9.]+)s\)$' | tr -d '()')
            tests=$(grep -cE "✓|✘" "/tmp/$1-$2.log")
            echo "RESULT $1 pass$2 tests=$tests wall=$((end-start))s round=${round} m8online=${m8} $(grep -E ' passed| failed| flaky' "/tmp/$1-$2.log" | tr -s ' ' | tr '\n' ' ')"
            grep -E "✘" "/tmp/$1-$2.log" | head -3 || true
          }
          for pass in 1 2; do
            for v in head main real-wakelock no-ring workers4; do run $v $pass; done
          done
