# Throwaway probe for PR #17 RC2 (not for merge). All variants on one machine, interleaved.
name: Probe
on:
  push:
    branches: [m8-ci-probe]
permissions:
  contents: read
jobs:
  same-machine:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: npm ci
      - name: Whole iPhone project x2 on head, logging fast alarms
        run: |
          npm run build > /dev/null 2>&1
          npx playwright test --project=iphone --workers=2 --reporter=list > /tmp/run.log 2>&1 || true
          grep -E "ROUNDLOG total|passed|failed" /tmp/run.log
          grep -c "PROBE fast alarm" /tmp/run.log || true
          grep -E "PROBE fast alarm" /tmp/run.log | cut -c1-900 | head -30 || true
